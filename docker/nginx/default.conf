map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

map $http_host $host_port {
    "~^.+:(?<p>\d+)$" $p;
    default "";
}

map $forwarded_proto $default_port {
    https 443;
    default $server_port;
}

map $host_port $port_from_host {
    default $host_port;
    "" $default_port;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    "" $port_from_host;
}

server {
    listen 80;
    server_name _;

    # Entrega estática de mídias públicas persistentes
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }
}
