services:
  app:
    build: .
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./data/storage:/var/www/html/storage/app
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mc_ctrlr
      DB_USERNAME: mc_ctrlr
      DB_PASSWORD: local_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: failover
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/storage/public:/var/www/html/storage/app/public:ro
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mc_ctrlr
      POSTGRES_USER: mc_ctrlr
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_ctrlr -d mc_ctrlr"]
      interval: 5s
      timeout: 3s
      retries: 10
  node:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
